<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord RH</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4CAF50; /* Vert forêt plus doux */
            --secondary-color: #007bff; /* Bleu d'origine pour les accents */
            --text-color: #333;
            --light-bg: #f8f9fa;
            --shadow-light: rgba(0, 0, 0, 0.1);
            --shadow-medium: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Roboto', sans-serif; /* Police principale plus moderne */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* Dégradé de fond léger pour plus de dynamisme */
            background: linear-gradient(135deg, #e0f2f7 0%, #c8e6c9 100%);
            color: var(--text-color);
            line-height: 1.6;
        }

        h1 {
            font-family: 'Montserrat', sans-serif; /* Police plus audacieuse pour le titre */
            color: var(--primary-color);
            margin-bottom: 40px;
            font-size: 2.8em; /* Taille de titre augmentée */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
            letter-spacing: 1px;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Plus flexible */
            gap: 30px; /* Espace plus généreux entre les cartes */
            padding: 25px;
            max-width: 960px; /* Largeur maximale augmentée */
            width: 90%;
            box-sizing: border-box;
        }

        .rh-button {
            display: flex;
            flex-direction: column; /* Organise le contenu en colonne (icône au-dessus du texte) */
            justify-content: center;
            align-items: center;
            background-color: white; /* Fond blanc pour les cartes */
            color: var(--primary-color); /* Couleur principale pour le texte des boutons */
            padding: 30px; /* Rembourrage accru */
            border: none;
            border-radius: 15px; /* Bords encore plus arrondis */
            font-size: 1.15em; /* Taille de texte légèrement ajustée */
            font-weight: 700; /* Texte plus gras */
            cursor: pointer;
            transition: all 0.3s ease; /* Transition plus globale */
            text-align: center;
            text-decoration: none;
            box-shadow: 0 8px 16px var(--shadow-light); /* Ombre plus douce */
            min-height: 160px; /* Hauteur minimale augmentée pour l'espace icône/texte */
        }

        .rh-button i { /* Style pour les icônes Font Awesome */
            font-size: 3em; /* Grande taille d'icône */
            margin-bottom: 15px; /* Espace entre l'icône et le texte */
            color: var(--secondary-color); /* Couleur différente pour les icônes */
            transition: color 0.3s ease;
        }

        .rh-button:hover {
            background-color: var(--primary-color); /* Couleur principale au survol */
            color: white; /* Texte blanc au survol */
            transform: translateY(-8px) scale(1.02); /* Effet de soulèvement plus prononcé et léger agrandissement */
            box-shadow: 0 12px 24px var(--shadow-medium); /* Ombre plus intense au survol */
        }

        .rh-button:hover i { /* Changer la couleur de l'icône au survol */
            color: white;
        }

        .rh-button:active {
            transform: translateY(-4px) scale(1.01); /* Effet de clic plus doux */
            box-shadow: 0 4px 8px var(--shadow-light);
        }

        /* Styles pour les petits écrans */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2em;
                margin-bottom: 30px;
            }
            .button-container {
                grid-template-columns: 1fr; /* Une seule colonne sur les petits écrans */
                gap: 20px;
                padding: 15px;
            }
            .rh-button {
                font-size: 1em;
                padding: 20px;
                min-height: 140px;
            }
            .rh-button i {
                font-size: 2.5em;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>Tableau de bord RH</h1>

    <div class="button-container">
        <a href="https://outlook.office.com/mail/" class="rh-button">
            <i class="fas fa-envelope"></i> OUTLOOK
        </a>

        <a href="https://fa-evbx-saasfaprod1.fa.ocs.oraclecloud.com/fscmUI/faces/FuseWelcome?_afrLoop=36877282618930191&fnd=%3B%3B%3B%3Bfalse%3B256%3B%3B%3B&_adf.ctrl-state=4n127dfht_3557" class="rh-button">
            <i class="fas fa-user-tie"></i> MyRH
        </a>

        <a href="https://www.myprimobox.net/auth/realms/myprimobox/protocol/openid-connect/auth?response_type=code&client_id=myp-v5&redirect_uri=https%3A%2F%2Fwww.myprimobox.net%2Fsso%2Flogin&state=92e05663-61ba-4b9a-a23f-bf4399b750b1&login=true&scope=openid" class="rh-button">
            <i class="fas fa-boxes"></i> MYprimobox
        </a>

        <a href="https://sebastienlv72.github.io/seba/" class="rh-button">
            <i class="fas fa-clock"></i> Pointage
        </a>
    </div>
</body>
</html>
